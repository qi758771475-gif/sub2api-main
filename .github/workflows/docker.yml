name: Docker Build and Push

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            platform: linux/amd64
            tag_suffix: ''
          - dockerfile: Dockerfile.ubuntu
            platform: linux/amd64
            tag_suffix: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          MAJOR=${VERSION%.*}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "MAJOR=${MAJOR}" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            qi758771475-gif/sub2api:${{ steps.version.outputs.VERSION }}${{ matrix.tag_suffix && format('-{0}', matrix.tag_suffix) || '' }}
            qi758771475-gif/sub2api:${{ steps.version.outputs.MAJOR }}${{ matrix.tag_suffix && format('-{0}', matrix.tag_suffix) || '' }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
            GOPROXY=https://goproxy.cn,direct
            GOSUMDB=sum.golang.google.cn